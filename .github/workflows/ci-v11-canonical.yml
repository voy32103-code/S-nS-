name: ci-v11-canonical
on: [push, pull_request]
jobs:
  full-stack-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: sanso_v11, POSTGRES_USER: sanso_ci, POSTGRES_PASSWORD: ci-ephemeral-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanso_ci -d sanso_v11"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      SANSO_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_v11;Username=sanso_ci;Password=ci-ephemeral-only
      SANSO_RUNTIME_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_v11;Username=sanso_ci;Password=ci-ephemeral-only
      PGPASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: "**/package-lock.json"}
      - name: Build canonical solution V5
        run: dotnet build SanSo.V5.slnx --configuration Release
      - name: Verify migration chain 001-011
        shell: pwsh
        run: ./scripts/verify-migration-manifest-v6.ps1 -Configuration Release
      - name: Apply append-only migrations twice
        run: |
          dotnet run --project backend/SanSo.Migrator.V4 --no-build --configuration Release
          dotnet run --project backend/SanSo.Migrator.V4 --no-build --configuration Release
      - name: Prove tenant RLS and import projection
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sanso_ci -d sanso_v11 -f scripts/verify-postgres-tenant-rls-v5.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sanso_ci -d sanso_v11 -f scripts/verify-import-projection-v5.sql
      - name: Run unit, HTTP, concurrency, and worker runtime tests
        run: dotnet test SanSo.V5.slnx --no-build --configuration Release
      - name: Verify canonical OpenAPI
        shell: pwsh
        run: ./scripts/verify-openapi-v4-canonical.ps1
      - name: Frontend V8 typecheck, component tests, build, and audit
        working-directory: frontend
        run: |
          npm ci
          npm exec tsc -- --project tsconfig.v8.json
          npm exec vitest -- run --config vitest.v8.config.ts
          npm exec vite -- build --config vite.v8.config.js
          npm audit --audit-level=high
      - name: Client secret and PII scan
        shell: pwsh
        run: ./scripts/scan-client-secrets-v2.ps1
      - name: Browser acceptance
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.auth-ui-v8.config.ts
      - name: NuGet vulnerability audit
        shell: pwsh
        run: |
          foreach ($project in Get-ChildItem backend -Filter *.csproj -Recurse) {
            dotnet list $project.FullName package --vulnerable --include-transitive
            if ($LASTEXITCODE -ne 0) { throw "NuGet audit failed: $($project.FullName)" }
          }
