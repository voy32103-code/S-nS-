name: ci-v12-canonical
on: [push, pull_request]
jobs:
  full-stack-v6:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: {POSTGRES_DB: sanso_v12, POSTGRES_USER: sanso_ci, POSTGRES_PASSWORD: ci-ephemeral-only}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanso_ci -d sanso_v12"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SANSO_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_v12;Username=sanso_ci;Password=ci-ephemeral-only
      SANSO_RUNTIME_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_v12;Username=sanso_ci;Password=ci-ephemeral-only
      PGPASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: dotnet build SanSo.V6.slnx --configuration Release
      - shell: pwsh
        run: ./scripts/verify-migration-manifest-v6.ps1 -Configuration Release
      - name: Migrate, verify RLS/projection, and test
        run: |
          dotnet run --project backend/SanSo.Migrator.V4 --no-build --configuration Release
          dotnet run --project backend/SanSo.Migrator.V4 --no-build --configuration Release
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sanso_ci -d sanso_v12 -f scripts/verify-postgres-tenant-rls-v5.sql
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sanso_ci -d sanso_v12 -f scripts/verify-import-projection-v5.sql
          dotnet test SanSo.V6.slnx --no-build --configuration Release
      - name: Frontend and browser gates
        run: |
          cd frontend
          npm ci
          npm exec tsc -- --project tsconfig.v8.json
          npm exec vitest -- run --config vitest.v8.config.ts
          npm exec vite -- build --config vite.v8.config.js
          cd ../e2e
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test --config playwright.auth-ui-v8.config.ts
      - shell: pwsh
        run: |
          ./scripts/verify-openapi-v4-canonical.ps1
          ./scripts/scan-client-secrets-v2.ps1
