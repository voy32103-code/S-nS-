name: ci-v14-canonical
on: [push, pull_request]
permissions:
  contents: read
jobs:
  canonical:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sanso_v14
          POSTGRES_USER: sanso_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanso_ci -d sanso_v14"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      SANSO_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_v14;Username=sanso_ci;Password=ci-ephemeral-only
      SANSO_RUNTIME_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_v14;Username=sanso_ci;Password=ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit canonical .NET dependencies
        shell: pwsh
        run: ./scripts/scan-dotnet-vulnerabilities-v14.ps1
      - name: Build canonical solution
        run: dotnet build SanSo.V10.slnx --configuration Release
      - name: Verify and apply migrations twice
        shell: pwsh
        run: |
          ./scripts/verify-migration-manifest-v13.ps1
          dotnet run --project backend/SanSo.Migrator.V8 --no-build --configuration Release
          dotnet run --project backend/SanSo.Migrator.V8 --no-build --configuration Release
      - name: Backend core tests
        run: dotnet test backend/SanSo.Api.Tests/SanSo.Api.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Import tests
        run: dotnet test backend/SanSo.Import.Tests/SanSo.Import.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: Worker unit tests
        run: dotnet test backend/SanSo.Worker.Tests/SanSo.Worker.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~OutboxProcessorTests" --logger "console;verbosity=normal"
      - name: Worker PostgreSQL live tests
        run: dotnet test backend/SanSo.Worker.Tests/SanSo.Worker.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresOutboxRuntimeV3Tests" --logger "console;verbosity=normal"
      - name: API V2 tests
        run: dotnet test backend/SanSo.Api.V2.Tests/SanSo.Api.V2.Tests.csproj --no-build --configuration Release --logger "console;verbosity=normal"
      - name: API V5 import projection live test
        run: dotnet test backend/SanSo.Api.V5.Tests/SanSo.Api.V5.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresImportProjectionHttpV5Tests" --logger "console;verbosity=normal"
      - name: API V5 inventory store concurrency test
        run: dotnet test backend/SanSo.Api.V5.Tests/SanSo.Api.V5.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresInventoryConcurrencyV4Tests" --logger "console;verbosity=normal"
      - name: API V5 inventory HTTP concurrency test
        run: dotnet test backend/SanSo.Api.V5.Tests/SanSo.Api.V5.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresInventoryHttpV5Tests" --logger "console;verbosity=normal"
      - name: API V6 non-PostgreSQL tests
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName!~Postgres" --logger "console;verbosity=normal"
      - name: API V6 inventory lifecycle live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresInventoryLifecycleHttpV6Tests" --logger "console;verbosity=normal"
      - name: API V6 notification HTTP live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresNotificationHttpV8Tests" --logger "console;verbosity=normal"
      - name: API V6 notification persistence live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresNotificationPersistenceV2Tests" --logger "console;verbosity=normal"
      - name: API V6 onboarding HTTP live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresOnboardingHttpV9Tests" --logger "console;verbosity=normal"
      - name: API V6 onboarding persistence live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresOnboardingPersistenceV1Tests" --logger "console;verbosity=normal"
      - name: API V6 report export HTTP live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresReportExportHttpV12Tests" --logger "console;verbosity=normal"
      - name: API V6 report export XLSX live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresReportExportXlsxV14Tests" --logger "console;verbosity=normal"
      - name: API V6 settlement import live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresSettlementImportHttpV10Tests" --logger "console;verbosity=normal"
      - name: API V6 settlement preview live test
        run: dotnet test backend/SanSo.Api.V6.Tests/SanSo.Api.V6.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~PostgresSettlementPreviewWorkflowV13Tests" --logger "console;verbosity=normal"

      - name: Verify OpenAPI
        shell: pwsh
        run: ./scripts/verify-openapi-v14.ps1
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Frontend unit and production build
        working-directory: frontend
        run: |
          npm test
          npm run build
      - name: Scan production client artifact
        shell: pwsh
        run: ./scripts/scan-client-secrets-v2.ps1
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Browser login accessibility
        working-directory: frontend
        run: npx playwright test accessibility-v8.spec.ts --grep "login has no WCAG A/AA violations"
      - name: Browser authenticated overview accessibility
        working-directory: frontend
        run: npx playwright test accessibility-v8.spec.ts --grep "authenticated overview has no WCAG A/AA violations"
      - name: Browser authenticated tabs accessibility
        working-directory: frontend
        run: npx playwright test accessibility-tabs-v8.spec.ts
      - name: Browser core journeys
        working-directory: frontend
        run: npx playwright test core-v8.spec.ts
      - name: Browser viewer authorization journey
        working-directory: frontend
        run: npx playwright test viewer-v8.spec.ts
      - name: Install E2E harness dependencies
        working-directory: e2e
        run: npm ci
      - name: Audit E2E harness dependencies
        working-directory: e2e
        run: npm audit --audit-level=high
