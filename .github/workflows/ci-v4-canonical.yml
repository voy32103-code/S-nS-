name: ci-v4-canonical
on: [push, pull_request]
jobs:
  canonical-build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: sanso_ci
          POSTGRES_USER: sanso_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sanso_ci -d sanso_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      SANSO_POSTGRES: Host=127.0.0.1;Port=5432;Database=sanso_ci;Username=sanso_ci;Password=ci-ephemeral-only
      PGPASSWORD: ci-ephemeral-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '9.0.x'}
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: 'npm', cache-dependency-path: "**/package-lock.json"}
      - name: Restore and build canonical solution
        run: dotnet restore SanSo.V4.slnx && dotnet build SanSo.V4.slnx --no-restore --configuration Release
      - name: Core API tests
        run: dotnet test backend/SanSo.Api.Tests/SanSo.Api.Tests.csproj --no-build --configuration Release
      - name: API V2 tests
        run: dotnet test backend/SanSo.Api.V2.Tests/SanSo.Api.V2.Tests.csproj --no-build --configuration Release
      - name: API V4 demo tests
        run: dotnet test backend/SanSo.Api.V4.Tests/SanSo.Api.V4.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName!~Postgres"
        env:
          SANSO_POSTGRES: ''
          SANSO_RUNTIME_POSTGRES: ''
      - name: API V4 PostgreSQL tests
        run: dotnet test backend/SanSo.Api.V4.Tests/SanSo.Api.V4.Tests.csproj --no-build --configuration Release --filter "FullyQualifiedName~Postgres"
      - name: Import tests
        run: dotnet test backend/SanSo.Import.Tests/SanSo.Import.Tests.csproj --no-build --configuration Release
      - name: Worker tests
        run: dotnet test backend/SanSo.Worker.Tests/SanSo.Worker.Tests.csproj --no-build --configuration Release
      - name: Verify migration and OpenAPI manifests
        shell: pwsh
        run: |
          ./scripts/verify-migration-manifest-v4.ps1 -Configuration Release
          ./scripts/verify-openapi-v4-canonical.ps1
      - name: Apply migrations twice (checksum and idempotency gate)
        run: |
          dotnet run --project backend/SanSo.Migrator.V2 --no-build --configuration Release
          dotnet run --project backend/SanSo.Migrator.V2 --no-build --configuration Release
      - name: Prove forced tenant RLS with a non-owner role
        run: psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U sanso_ci -d sanso_ci -f scripts/verify-postgres-tenant-rls-v5.sql
      - name: Frontend canonical typecheck, tests, and build
        working-directory: frontend
        run: |
          npm ci
          npm exec tsc -- --project tsconfig.v7.json
          npm exec vitest -- run --config vitest.v8.config.ts
          npm exec vite -- build --config vite.v7.config.js
          npm audit --audit-level=high
      - name: Scan client artifacts for secrets and PII patterns
        shell: pwsh
        run: ./scripts/scan-client-secrets-v2.ps1
      - name: Install Playwright
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Import preview/confirm browser acceptance
        working-directory: e2e
        env:
          SANSO_POSTGRES: ''
        run: npx playwright test --config playwright.import-v4-cors.config.ts
      - name: Dependency audit for .NET projects
        shell: pwsh
        run: |
          $projects = Get-ChildItem backend -Filter *.csproj -Recurse
          foreach ($project in $projects) {
            dotnet list $project.FullName package --vulnerable --include-transitive
            if ($LASTEXITCODE -ne 0) { throw "NuGet audit failed: $($project.FullName)" }
          }
