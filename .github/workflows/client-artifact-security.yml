name: Client artifact security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bundle-secret-scan:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Build production bundle
        working-directory: frontend
        run: npm run build
      - name: Scan bundle and logs for secret or PII patterns
        shell: powershell
        run: ./scripts/scan-client-secrets-v2.ps1
